<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="MintSwitch mark">
  <!-- MintSwitch mark — "Route Switch" (Wave 2 final, light-background palette).
       Grid 48 · stroke 4.5 round-cap · node r 4.
       Geometry: input node (8.5,24) → junction (20,24); branches use symmetric
       controls (27,24)/(27,12|36), level off at (34,12|36) and run straight into
       terminal node centers (38,12|36) so caps are absorbed by the nodes.
       Ink bounds: x 4.5–42, y 8–40 (37.5×32) · optical square crop: 4 4 40 40. -->
  <path d="M20 24C27 24 27 36 34 36H38" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M8.5 24H20C27 24 27 12 34 12H38" stroke="#135bec" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="8.5" cy="24" r="4" fill="#135bec"/>
  <circle cx="38" cy="12" r="4" fill="#135bec"/>
  <circle cx="38" cy="36" r="4" fill="#0d9488"/>
</svg>
