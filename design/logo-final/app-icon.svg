<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="MintSwitch app icon">
  <!-- MintSwitch app-icon composition, 1024×1024 vector source (proposal — does NOT
       replace build/appicon.png or platform icons).
       Full-bleed square tile: platform pipelines apply their own masks
       (macOS squircle ≈ 22.37% radius, Android/web maskable circle) — verified in brand-guide.html.
       Mark: translate(128,128) scale(16) → ink 600×512, visual center (500,512)
       (0.75-unit optical left shift), white active route + light-mint alternate on brand gradient.
       Contrast on gradient: white ≥4.49:1, #9fe8dc ≥3.22:1 (≥3:1 graphics). -->
  <defs>
    <linearGradient id="tile" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6ff2"/>
      <stop offset="1" stop-color="#0f4fd6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g transform="translate(128 128) scale(16)">
    <path d="M20 24C27 24 27 36 34 36H38" stroke="#9fe8dc" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M8.5 24H20C27 24 27 12 34 12H38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="8.5" cy="24" r="4" fill="#ffffff"/>
    <circle cx="38" cy="12" r="4" fill="#ffffff"/>
    <circle cx="38" cy="36" r="4" fill="#9fe8dc"/>
  </g>
</svg>
