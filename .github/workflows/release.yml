# Release pipeline: builds MintSwitch for Windows/Linux/macOS on tag push (v*)
# and attaches the artifacts to a GitHub Release.
#
# NOTE: No code signing or notarization is performed (out of scope).
#   - macOS: the Taskfile ad-hoc signs the .app (codesign --sign -); users may
#     need to right-click > Open or clear the quarantine attribute on first run.
#   - Windows: the .exe is unsigned; SmartScreen may warn on first run.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep in sync with the wails/v3 version in go.mod
  WAILS3_VERSION: v3.0.0-alpha2.109

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Wails v3 on Linux needs GTK4 + WebKitGTK 6.0 dev headers (CGO):
      # the wails3 CLI checks pkg-config for gtk4 and webkitgtk-6.0.
      # Package names verified on packages.ubuntu.com for noble (24.04):
      # libgtk-4-dev, libwebkitgtk-6.0-dev (universe, source: webkit2gtk).
      # Build tooling (gcc, pkg-config, git, etc.) is preinstalled on the
      # hosted ubuntu-latest image.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI (pinned to go.mod version)
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Produces bin/mintswitch + "bin/MintSwitch By MintRouter.AI.app" (ad-hoc signed by the Taskfile)
      - name: Build macOS .app
        if: matrix.platform == 'darwin'
        run: wails3 task package

      # Produces bin/mintswitch, generates build/linux/mintswitch.desktop and
      # packages everything into a .deb via nfpm (embedded in the wails3 CLI —
      # no extra install needed). The nfpm version is synced to the tag first.
      - name: Build Linux .deb
        if: matrix.platform == 'linux'
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" build/linux/nfpm/nfpm.yaml
          wails3 task linux:create:deb

      # Produces bin/MintSwitch.exe (production flags, CGO disabled); the
      # Windows Taskfile overrides APP_NAME to "MintSwitch" so the binary,
      # NSIS and MSIX all use the same casing.
      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        run: wails3 task windows:build

      # Standard drag-to-install DMG: the .app next to an /Applications symlink.
      - name: Package artifact (macOS)
        if: matrix.platform == 'darwin'
        run: |
          mkdir dmg-stage
          cp -R "bin/MintSwitch By MintRouter.AI.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "MintSwitch" -srcfolder dmg-stage -ov -format UDZO "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.dmg"

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        run: mv bin/*.deb "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.deb"

      # The Windows build is a single self-contained portable .exe (assets
      # embedded, CGO disabled, WebView2 is an OS component), shipped zipped
      # as MintSwitch.exe.
      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path bin/MintSwitch.exe -DestinationPath "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}
          path: MintSwitch-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
