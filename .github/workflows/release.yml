# Release pipeline: builds MintSwitch for Windows/Linux/macOS on tag push (v*)
# and attaches the artifacts to a GitHub Release.
#
# NOTE: No code signing or notarization is performed (out of scope).
#   - macOS: the Taskfile ad-hoc signs the .app (codesign --sign -); users may
#     need to right-click > Open or clear the quarantine attribute on first run.
#   - Windows: the .exe is unsigned; SmartScreen may warn on first run.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep in sync with the wails/v3 version in go.mod
  WAILS3_VERSION: v3.0.0-alpha2.109

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # Linux builds run inside a clean ubuntu:24.04 container on the
    # self-hosted runners: apt-get runs as root (no sudo required on the
    # host) and the environment matches the previous ubuntu-latest setup
    # regardless of the host distro. Empty for macOS/Windows (no container).
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          # Labels match both self-hosted Linux runners so whichever is idle
          # picks the job up (requires Docker on the runner host).
          - os: [self-hosted, Linux, X64]
            container: ubuntu:24.04
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
    steps:
      # Wails v3 on Linux needs GTK4 + WebKitGTK 6.0 dev headers (CGO):
      # the wails3 CLI checks pkg-config for gtk4 and webkitgtk-6.0.
      # Package names verified on packages.ubuntu.com for noble (24.04):
      # libgtk-4-dev, libwebkitgtk-6.0-dev (universe, source: webkit2gtk).
      #
      # Runs before checkout so git is available inside the bare container
      # (actions/checkout falls back to a tarball download without it).
      # Extra packages vs the old hosted job (which preinstalls them):
      # git (checkout), ca-certificates (TLS for go install/module fetch),
      # zstd (actions/cache compression used by setup-go/setup-node).
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config git ca-certificates zstd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI (pinned to go.mod version)
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Produces bin/mintswitch + "bin/MintSwitch By MintRouter.AI.app" (ad-hoc signed by the Taskfile)
      - name: Build macOS .app
        if: matrix.platform == 'darwin'
        run: wails3 task package

      # Produces bin/mintswitch and generates build/linux/mintswitch.desktop
      - name: Build Linux binary
        if: matrix.platform == 'linux'
        run: wails3 task linux:build

      # Produces bin/mintswitch.exe (production flags, CGO disabled)
      - name: Build Windows .exe
        if: matrix.platform == 'windows'
        run: wails3 task windows:build

      - name: Package artifact (macOS)
        if: matrix.platform == 'darwin'
        run: ditto -c -k --keepParent "bin/MintSwitch By MintRouter.AI.app" "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p stage/MintSwitch
          cp bin/mintswitch stage/MintSwitch/
          cp build/linux/mintswitch.desktop stage/MintSwitch/
          cp build/appicon.png stage/MintSwitch/mintswitch.png
          tar -czf "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C stage MintSwitch

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path bin/mintswitch.exe -DestinationPath "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}
          path: MintSwitch-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    # Also self-hosted: this job only downloads artifacts and calls the
    # GitHub API, so it has no OS dependencies and needs no container.
    runs-on: [self-hosted, Linux, X64]
    steps:
      # The self-hosted workspace persists between runs; remove any stale
      # dist/ so old artifacts can't leak into the release assets.
      - name: Clean stale artifacts
        run: rm -rf dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
