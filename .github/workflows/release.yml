# Unsigned desktop release pipeline. No signing or notarization is required.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  WAILS3_VERSION: "v3.0.0-alpha2.111"

jobs:
  quality:
    name: Required quality gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: universal
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS app
        if: matrix.platform == 'darwin'
        run: wails3 task darwin:package:universal

      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" build/linux/nfpm/nfpm.yaml
          wails3 task linux:create:deb

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Build Windows app and installer
        if: matrix.platform == 'windows'
        run: wails3 task windows:package

      - name: Package macOS artifact
        if: matrix.platform == 'darwin'
        run: |
          mkdir dmg-stage
          cp -R "bin/MintSwitch By MintRouter.AI.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "MintSwitch" -srcfolder dmg-stage -ov -format UDZO "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.dmg"

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        run: mv bin/*.deb "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.deb"

      - name: Package Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bin/MintSwitch.exe -DestinationPath "MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Move-Item "bin/MintSwitch-${{ matrix.arch }}-installer.exe" "MintSwitch-Setup-${{ matrix.platform }}-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MintSwitch-${{ matrix.platform }}-${{ matrix.arch }}
          path: MintSwitch-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
